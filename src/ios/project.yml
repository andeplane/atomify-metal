# XcodeGen spec for the Atomify iPhone and iPad app.
# Generate the project with `xcodegen generate --spec src/ios/project.yml`;
# the generated Atomify.xcodeproj is not committed. See README.md.
name: Atomify

options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  # The root Package.swift: AtomifyKit with AtomifyEngine, AtomifyRender and CLammps.
  AtomifyMetal:
    path: ../..

targets:
  Atomify:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AtomifyIOS
      # The same bundled examples as the Mac app, copied into the app as a folder.
      - path: ../macos/AtomifyMac/Examples
        type: folder
        buildPhase: resources
    dependencies:
      - package: AtomifyMetal
        product: AtomifyKit
    settings:
      base:
        PRODUCT_NAME: Atomify
        PRODUCT_BUNDLE_IDENTIFIER: $(ATOMIFY_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Atomify
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  Atomify:
    build:
      targets:
        Atomify: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
